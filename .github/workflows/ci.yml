name: CI - Dream Decorators ERP Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Lint, Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=packages/database

      - name: Typecheck Database Package
        run: npm run build --workspace=@dream-decorators/database

      - name: Typecheck & Build Backend
        run: npm run build --workspace=@dream-decorators/backend

      - name: Build Frontend Next.js Bundle
        run: npm run build --workspace=@dream-decorators/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
